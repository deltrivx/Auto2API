name: Deploy

# =============================================================================
# 交付链说明
# =============================================================================
# 1. Build 工作流：打 vX.Y.Z 标签 → 编译二进制 → 发布 GitHub Release
# 2. Docker 工作流：同一标签 → 构建并推送 ghcr.io/<repo>:<version> 与 :latest
# 3. 生产更新：宝塔面板 → Docker → 容器编排 → 拉取镜像 → 重建
#
# 本工作流只做「发布产物校验」，不再向服务器推送二进制、不操作 systemd。
# 历史上这里是二进制 + systemd 落地，服务器切到容器后这条路径已失效，
# 保留会与容器部署形成第二套写入路径，故改为只校验 + 给出面板更新指引。
# =============================================================================

on:
  workflow_run:
    workflows: ["Build"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: '要校验的版本标签，如 v1.2.17；留空则取最新 Release'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release-verify
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release artifacts
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    steps:
      - name: Resolve tag
        id: t
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            TAG="${{ github.event.workflow_run.head_branch }}"
          else
            TAG=""
          fi
          if [ -z "$TAG" ]; then
            TAG=$(curl -fsS "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest" \
                  | python3 -c "import json,sys;print(json.load(sys.stdin)['tag_name'])")
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "校验目标: $TAG"

      - name: Verify release assets
        run: |
          TAG="${{ steps.t.outputs.tag }}"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          for f in auto2api auto2api.sha256; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' -L "$BASE/$f")
            echo "$f -> HTTP $code"
            if [ "$code" != "200" ]; then
              echo "::error::Release 缺少产物 $f（$TAG）"
              exit 1
            fi
          done

      - name: Verify container image
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          V="${{ steps.t.outputs.version }}"
          REPO=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          AUTH_ARGS=""
          if [ -n "${GHCR_TOKEN}" ]; then
            AUTH_ARGS="-u ${GITHUB_ACTOR}:${GHCR_TOKEN}"
          fi
          TOKEN=$(curl -fsS ${AUTH_ARGS} \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:${REPO}:pull" \
            | python3 -c "import json,sys;print(json.load(sys.stdin).get('token',''))")
          if [ -z "$TOKEN" ]; then
            echo "::error::无法获取 GHCR 拉取令牌"
            exit 1
          fi
          ACCEPT="application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json"
          for T in "$V" latest; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $TOKEN" -H "Accept: $ACCEPT" \
              "https://ghcr.io/v2/${REPO}/manifests/${T}")
            echo "ghcr.io/${REPO}:${T} -> HTTP $code"
            if [ "$code" != "200" ]; then
              echo "::error::镜像标签 ${T} 不存在"
              exit 1
            fi
          done

      - name: Summary
        run: |
          {
            echo "### 发布产物校验通过"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 版本 | \`${{ steps.t.outputs.tag }}\` |"
            echo "| 二进制 | Release assets（auto2api + sha256） |"
            echo "| 镜像 | \`ghcr.io/${{ github.repository }}:${{ steps.t.outputs.version }}\` |"
            echo "| 镜像 | \`ghcr.io/${{ github.repository }}:latest\` |"
            echo ""
            echo "### 宝塔面板更新（容器编排）"
            echo ""
            echo "1. 宝塔 → Docker → 容器编排，选择 \`auto2api\` 项目"
            echo "2. 先「拉取镜像」，再「重建」（compose up -d）"
            echo "3. 等健康检查变绿，验证 <https://auto2api.deltrivx.cn/health>"
          } >> "$GITHUB_STEP_SUMMARY"
