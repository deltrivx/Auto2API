name: Deploy

# =============================================================================
# 交付链说明
# =============================================================================
# 1. Build 工作流：打 vX.Y.Z 标签 → 编译二进制 → 发布 GitHub Release
# 2. Docker 工作流：同一标签 → 构建并推送 ghcr.io/<repo>:<version> 与 :latest
# 3. 生产更新：宝塔面板 → Docker → 容器编排 → 拉取镜像 → 重建
#
# 本工作流只做「发布产物校验」，不再向服务器推送二进制、不操作 systemd。
# 历史上这里是二进制 + systemd 落地，服务器切到容器后这条路径已失效，
# 保留会与容器部署形成第二套写入路径，故改为只校验 + 给出面板更新指引。
# =============================================================================

on:
  workflow_run:
    workflows: ["Build"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: '要校验的版本标签，如 v1.2.17；留空则取最新 Release'
        required: false
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: release-verify
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release artifacts
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    steps:
      - name: Resolve tag
        id: t
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            TAG="${{ github.event.workflow_run.head_branch }}"
          else
            TAG=""
          fi
          if [ -z "$TAG" ]; then
            TAG=$(curl -fsS "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest" \
                  | python3 -c "import json,sys;print(json.load(sys.stdin)['tag_name'])")
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "校验目标: $TAG"

      - name: Verify release assets
        run: |
          TAG="${{ steps.t.outputs.tag }}"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          for f in auto2api auto2api.sha256; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' -L "$BASE/$f")
            echo "$f -> HTTP $code"
            if [ "$code" != "200" ]; then
              echo "::error::Release 缺少产物 $f（$TAG）"
              exit 1
            fi
          done

      - name: Verify container image workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.t.outputs.tag }}"
          for i in $(seq 1 40); do
            curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/docker.yml/runs?per_page=50" \
              -o runs.json
            RES=$(python3 - "$TAG" <<'PY'
          import json, sys
          tag = sys.argv[1]
          runs = json.load(open("runs.json")).get("workflow_runs", [])
          hits = [r for r in runs if (r.get("head_branch") or "") == tag and r.get("event") == "push"]
          if not hits:
              print("MISSING"); sys.exit(0)
          r = hits[0]
          if r.get("status") != "completed":
              print(f"PENDING {r.get('status')}"); sys.exit(0)
          print(f"DONE {r.get('conclusion')} run={r.get('run_number')}")
          PY
          )
            echo "[$i] $RES"
            case "$RES" in
              DONE\ success*) exit 0 ;;
              DONE*) echo "::error::${TAG} 镜像构建失败：$RES"; exit 1 ;;
            esac
            sleep 30
          done
          echo "::error::等待 ${TAG} 镜像构建超时"
          exit 1
      - name: Summary
        run: |
          {
            echo "### 发布产物校验通过"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 版本 | \`${{ steps.t.outputs.tag }}\` |"
            echo "| 二进制 | Release assets（auto2api + sha256） |"
            echo "| 镜像 | \`ghcr.io/${{ github.repository }}:${{ steps.t.outputs.version }}\` |"
            echo "| 镜像 | \`ghcr.io/${{ github.repository }}:latest\` |"
            echo ""
            echo "### 宝塔面板更新（容器编排）"
            echo ""
            echo "1. 宝塔 → Docker → 容器编排，选择 \`auto2api\` 项目"
            echo "2. 先「拉取镜像」，再「重建」（compose up -d）"
            echo "3. 等健康检查变绿，验证 <https://auto2api.deltrivx.cn/health>"
          } >> "$GITHUB_STEP_SUMMARY"
