name: Deploy

# 发布新版(Release published)后自动部署到阿里云服务器并验证结果。
# 也支持手动指定版本重新部署（workflow_dispatch）。
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: '要部署的版本标签，如 v1.0.49；留空则部署 GitHub 最新 Release'
        required: false
        default: ''

permissions:
  contents: read

# 同一时间只允许一个部署，避免并发替换二进制
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Aliyun ECS
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - name: Resolve target tag
        id: t
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="latest"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "部署目标: $TAG"

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H -T 15 "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          echo "已记录主机公钥:"; ssh-keygen -lf ~/.ssh/known_hosts | head -3

      - name: Run remote deploy
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "${{ steps.t.outputs.tag }}" \
            | tee deploy.log
          grep -q '^DEPLOY_OK' deploy.log

      - name: Verify service status
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=20 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" status | tee status.log
          grep -qE 'service=active' status.log
          grep -q '"status":"ok"' status.log

      - name: Summary
        if: always()
        run: |
          {
            echo "### Auto2API 部署结果"
            echo ""
            echo "- 目标版本: \`${{ steps.t.outputs.tag }}\`"
            echo "- 触发方式: \`${{ github.event_name }}\`"
            echo ""
            echo '```'
            cat deploy.log 2>/dev/null | tail -25 || echo '无部署日志'
            echo '--- 状态 ---'
            cat status.log 2>/dev/null || echo '无状态输出'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
