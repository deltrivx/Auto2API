name: Build

on:
  push:
    # 只由标签驱动：打 tag 即构建并发布，main 推送不再重复构建一次。
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  GO_VERSION: '1.27.4'
  NODE_VERSION: '24'

jobs:
  build:
    name: Build linux/amd64
    # PR 只验证能否编译，不产出可发布的产物；tag 与手动触发才走完整构建。
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Verify frontend output
        run: |
          test -f backend/internal/web/dist/index.html \
            || { echo "::error::frontend dist missing"; exit 1; }
          echo "frontend dist:"
          ls -la backend/internal/web/dist | head -20

      - name: Resolve version
        id: version
        run: echo "value=$(./scripts/resolve-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Build backend
        working-directory: backend
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
          APP_VERSION: ${{ steps.version.outputs.value }}
        run: |
          go build \
            -tags embed \
            -trimpath \
            -ldflags "-s -w -X main.Version=${APP_VERSION} -X main.BuildType=release" \
            -o ../auto2api \
            ./cmd/server

      - name: Smoke test
        run: |
          chmod +x auto2api
          ./auto2api --version || true
          file auto2api
          ls -lh auto2api

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: auto2api-linux-amd64
          path: auto2api
          retention-days: 30
          compression-level: 9

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download artifact
        uses: actions/download-artifact@v5
        with:
          name: auto2api-linux-amd64

      - name: Checksums
        run: |
          sha256sum auto2api > auto2api.sha256
          cat auto2api.sha256

      - name: Extract release notes
        id: notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          # 从 CHANGELOG.md 截取 "## <tag>" 到下一个 "## " 之间的内容。
          # 找不到时回退到一句占位说明，避免发布出空描述。
          awk -v tag="## ${TAG}" '
            $0 == tag { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            {
              echo "## ${TAG}"
              echo
              echo "本次发布的内容请见仓库提交记录。"
            } > release_notes.md
          fi
          cat release_notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            auto2api
            auto2api.sha256
          body_path: release_notes.md
