name: Verify Build (temporary)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: go build
        working-directory: backend
        run: go build ./...

      - name: go vet
        working-directory: backend
        run: go vet ./... || true

      - name: go test compile check
        working-directory: backend
        run: go test -run XXX -count=1 ./... 2>&1 | tail -40