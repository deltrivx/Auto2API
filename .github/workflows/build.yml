name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  GO_VERSION: '1.27.3'
  NODE_VERSION: '26'

jobs:
  build:
    name: Build linux/amd64
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Verify frontend output
        run: |
          test -f backend/internal/web/dist/index.html \
            || { echo "::error::frontend dist missing"; exit 1; }
          echo "frontend dist:"
          ls -la backend/internal/web/dist | head -20

      - name: Build backend
        working-directory: backend
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          go build \
            -tags embed \
            -trimpath \
            -ldflags "-s -w -X main.Version=${GITHUB_REF_NAME}" \
            -o ../auto2api \
            ./cmd/server

      - name: Smoke test
        run: |
          chmod +x auto2api
          ./auto2api --version || true
          file auto2api
          ls -lh auto2api

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: auto2api-linux-amd64
          path: auto2api
          retention-days: 30
          compression-level: 9

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: auto2api-linux-amd64

      - name: Checksums
        run: |
          sha256sum auto2api > auto2api.sha256
          cat auto2api.sha256

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            auto2api
            auto2api.sha256
          generate_release_notes: true
